name: "Repair, Sync & Build King System"

on:
  workflow_dispatch: # Activación manual desde GitHub Actions

jobs:
  repair-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Aplicar Correcciones Estructurales y Overrides
        run: |
          # 1. Asegurar metro.config.js actualizado
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          const config = {};
          module.exports = mergeConfig(getDefaultConfig(__dirname), config);
          INNER_EOF

          # 2. Inyectar overrides para la versión estable de connect
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.overrides = pkg.overrides || {};
          pkg.overrides["connect"] = "3.7.0";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: 🧹 Limpieza e Instalación Limpia de Dependencias
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install

      - name: 🔍 Verificación Estática de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧹 Análisis de Calidad de Código (Lint)
        run: npm run lint || true

      - name: 🚀 Generar Pull Request con la App Reparada y Sincronizada
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(core): reparación total y sincronización de nodos de la interfaz"
          title: "🛡️ Reparación y Sincronización Automática - King System v2.4.0"
          body: |
            Este flujo ejecutó una revisión y blindaje completo del repositorio:
            - ✅ Actualización de `metro.config.js` para React Native 0.76.
            - ✅ Blindaje de dependencias (`connect@3.7.0` mediante `overrides`).
            - ✅ Limpieza profunda de cachés de paquetes.
            - ✅ Verificación de tipos (`tsc`) y linters en la nube.
          branch: fix/repair-entire-app
          signoff: true
