name: Compilar King System APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inyectar version de Kotlin via expo-build-properties en app.json
        run: |
          node -e '
            const fs = require("fs");
            let file = "app.json";
            let data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.expo.plugins = data.expo.plugins || [];
            
            let bp = data.expo.plugins.find(p => Array.isArray(p) && p[0] === "expo-build-properties");
            if (bp) {
              bp[1].android = bp[1].android || {};
              bp[1].android.kotlinVersion = "1.9.25";
            } else {
              data.expo.plugins.push([
                "expo-build-properties",
                {
                  "android": {
                    "kotlinVersion": "1.9.25"
                  }
                }
              ]);
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          '

      - name: Generar Estructura Nativa (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Compilar APK Definitivo (Debug)
        run: |
          cd android && ./gradlew assembleDebug

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingSystem-Debug
          path: android/app/build/outputs/apk/debug/*.apk
