name: Compilar King System APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos a Gradle
        run: |
          if [ -d "android" ]; then
            cd android && chmod +x gradlew
          fi

      - name: Compilar APK King System (Debug)
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Estructura nativa pendiente de prebuild."
          fi

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingSystem-Debug
          path: android/app/build/outputs/apk/debug/*.apk
