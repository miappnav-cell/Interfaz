name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar Dependencias
        run: npm install

      - name: 5. Generar Proyecto Nativo (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: 6. Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Subir Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: KingSystem-v2.4.0-APK
          path: android/app/build/outputs/apk/debug/*.apk
