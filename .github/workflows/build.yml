name: Compilar King System APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Corregir versiones incompatibles en package.json
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            const fixes = {
              "expo-router": "~4.0.0",
              "expo-status-bar": "~2.0.0",
              "expo-constants": "~17.0.0",
              "expo-linking": "~7.0.0",
              "expo-splash-screen": "~0.29.0",
              "expo-file-system": "~18.0.0",
              "expo-secure-store": "~14.0.0",
              "expo-av": "~15.0.0",
              "expo-image": "~2.0.0"
            };

            ["dependencies", "devDependencies"].forEach(depType => {
              if (pkg[depType]) {
                for (let dep in pkg[depType]) {
                  if (pkg[depType][dep] === "~52.0.0" && dep !== "expo") {
                    if (fixes[dep]) {
                      pkg[depType][dep] = fixes[dep];
                    } else {
                      pkg[depType][dep] = "*";
                    }
                  }
                }
              }
            });

            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar CLI de React Native
        run: npm install --save-dev @react-native-community/cli

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear assets temporales
        run: |
          mkdir -p assets
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > assets/icon.png
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > assets/adaptive-icon.png
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > assets/splash.png

      - name: Crear metro.config.js
        run: |
          cat << 'CONFIG' > metro.config.js
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          module.exports = config;
          CONFIG

      - name: Generar Estructura Nativa (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: Desactivar Nueva Arquitectura (Evitar errores C++)
        run: |
          if [ -f "android/gradle.properties" ]; then
            sed -i 's/newArchEnabled=true/newArchEnabled=false/g' android/gradle.properties || echo "newArchEnabled=false" >> android/gradle.properties
          else
            echo "newArchEnabled=false" >> android/gradle.properties
          fi

      - name: Empaquetar Bundle de JavaScript Offline
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Dar permisos a Gradle
        run: |
          cd android && chmod +x gradlew

      - name: Compilar APK King System (Debug)
        run: |
          cd android && ./gradlew assembleDebug

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingSystem-Debug
          path: android/app/build/outputs/apk/debug/*.apk
