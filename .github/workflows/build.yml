name: Compilar King System APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias (Sin interrupciones de red)
        run: npm install --legacy-peer-deps

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar Estructura Nativa (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Forzar Kotlin 1.9.25 para compatibilidad con Compose
        run: |
          if [ -f "android/build.gradle" ]; then
            node -e '
              const fs = require("fs");
              let file = "android/build.gradle";
              let content = fs.readFileSync(file, "utf8");
              if (content.includes("kotlinVersion =")) {
                content = content.replace(/kotlinVersion\s*=\s*["\x27].*?["\x27]/g, "kotlinVersion = \"1.9.25\"");
              } else {
                content = content.replace("buildscript {", "buildscript {\n    ext.kotlinVersion = \"1.9.25\";");
              }
              fs.writeFileSync(file, content);
            '
          fi

      - name: Compilar APK Definitivo (Debug)
        run: |
          cd android && ./gradlew assembleDebug

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingSystem-Debug
          path: android/app/build/outputs/apk/debug/*.apk
