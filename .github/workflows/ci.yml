name: King System Standalone APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v3

    - name: ⚙️ Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📦 Instalar dependencias
      run: npm install

    - name: 📌 Detectar versión actual
      id: get_version
      run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

    - name: 🛠️ Generar entorno nativo Android
      run: npx expo prebuild --platform android --non-interactive
      env:
        CI: "1"

    - name: 🔧 Configurar APK autónomo para instalación directa
      run: |
        sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

    - name: 🏗️ Compilar APK Autónomo (Release) con Gradle
      run: |
        cd android
        ./gradlew assembleRelease

    - name: 📤 Subir APK como Artefacto Sincronizado
      uses: actions/upload-artifact@v4
      with:
        name: king-system-v${{ env.VERSION }}-release
        path: android/app/build/outputs/apk/release/app-release.apk
