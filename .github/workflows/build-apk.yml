name: "Build King System APK Release"

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔍 Ejecutar Auditoría y Mapeo de Nodos y Pantallas
        run: |
          node audit-project.js

      - name: 📥 Instalar dependencias con YARN
        run: |
          npm install -g yarn
          yarn install --legacy-peer-deps

      - name: 🏗️ Generar Entorno Nativo con Expo Prebuild
        run: |
          npx expo prebuild --platform android --clean --non-interactive

      - name: 🔨 Generar Bundle y Compilar APK con Gradle
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: 📤 Subir APK con Arquitectura Mapeada
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
