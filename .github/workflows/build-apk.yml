name: "Build King System APK Release"

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔍 Ejecutar Auditoría Total del Proyecto
        run: |
          node audit-project.js

      - name: 💣 Limpieza Profunda de Cachés
        run: |
          rm -rf node_modules package-lock.json yarn.lock android ios .gradle android/app/build

      - name: 🛡️ Inyectar Lógica Maestra de Seguridad y Biometría
        run: |
          # 1. Blindar package.json asegurando Expo, Axios y Autenticación Biométrica
          node -e '
          const fs = require("fs");
          let pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (!pkg.version || pkg.version.trim() === "") pkg.version = "1.0.0";
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies["expo"] = "~49.0.15";
          pkg.dependencies["expo-status-bar"] = "~1.6.0";
          pkg.dependencies["expo-local-authentication"] = "~13.4.0";
          pkg.dependencies["react"] = "18.2.0";
          pkg.dependencies["react-native"] = "0.72.6";
          pkg.dependencies["axios"] = "^1.6.2";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          console.log("✅ Dependencias maestras inyectadas.");
          '

          # 2. Crear app.json obligatorio para Expo Prebuild
          cat << 'APP_EOF' > app.json
          {
            "expo": {
              "name": "King System",
              "slug": "king-system",
              "version": "1.0.0",
              "sdkVersion": "49.0.0",
              "android": {
                "package": "com.kingsystem.interfaz"
              }
            }
          }
          APP_EOF

          # 3. Crear Servicio de Seguridad Activo para el Servidor
          mkdir -p src/services src/config
          cat << 'SEC_EOF' > src/services/securityService.js
          import axios from 'axios';
          import * as LocalAuthentication from 'expo-local-authentication';

          const SERVER_URL = "https://api.kingsystem.com/v1";

          export const securityService = {
            async authenticateAdmin() {
              try {
                const hasHardware = await LocalAuthentication.hasHardwareAsync();
                if (!hasHardware) return { success: true, message: "Sin hardware biométrico, acceso libre." };
                
                const result = await LocalAuthentication.authenticateAsync({
                  promptMessage: "King System - Autenticación de Administrador Maestro",
                  fallbackLabel: "Usar PIN de seguridad",
                });
                return result;
              } catch (error) {
                console.error("Error biométrico:", error);
                return { success: false, error: error.message };
              }
            },

            async sendMasterCommand(action, payload) {
              const auth = await this.authenticateAdmin();
              if (!auth.success) {
                throw new Error("Acceso denegado por seguridad biométrica.");
              }

              const response = await axios.post(`${SERVER_URL}/system/command`, {
                action,
                payload,
                timestamp: new Date().toISOString(),
                source: "King System Master App"
              });
              return response.data;
            }
          };
          console.log("🛡️ securityService cargado y activo.");
          SEC_EOF

      - name: 🌐 Asegurar Configuración API
        run: |
          mkdir -p src/api
          if [ ! -f "src/api/endpoints.js" ]; then
            cat << 'API_EOF' > src/api/endpoints.js
            import axios from "axios";
            const SERVER_URL = "https://api.kingsystem.com/v1";
            export const apiClient = axios.create({
              baseURL: SERVER_URL,
              timeout: 10000,
              headers: { "Content-Type": "application/json", "Accept": "application/json" }
            });
            export const endpoints = {
              auth: { login: "/auth/login", register: "/auth/register" },
              system: { sync: "/system/sync-nodes", status: "/system/status", command: "/system/command" }
            };
            API_EOF
          fi

      - name: 📥 Instalar dependencias con YARN
        run: |
          npm install -g yarn
          yarn install --legacy-peer-deps

      - name: 🏗️ Generar Entorno Nativo con Expo Prebuild
        run: |
          npx expo prebuild --platform android --clean --non-interactive

      - name: 🔨 Compilar APK Definitivo con Seguridad Integrada
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: 📤 Subir APK con Seguridad y Módulos Activos
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
