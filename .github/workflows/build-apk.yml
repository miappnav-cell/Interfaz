name: "Build King System APK Release"

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💣 Limpiar Cachés
        run: |
          rm -rf node_modules package-lock.json yarn.lock android/.gradle android/app/build

      - name: 📝 Saneamiento y Blindaje de Expo en package.json
        run: |
          node -e '
          const fs = require("fs");
          let pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          
          if (!pkg.version || pkg.version.trim() === "" || !/^\d+\.\d+\.\d+/.test(pkg.version)) {
            pkg.version = "1.0.0";
          }
          
          pkg.dependencies = pkg.dependencies || {};
          pkg.devDependencies = pkg.devDependencies || {};
          
          // Asegurar dependencias esenciales de Expo y React Native para que Metro no falle
          pkg.dependencies["expo"] = "~49.0.15";
          pkg.dependencies["expo-status-bar"] = "~1.6.0";
          pkg.dependencies["react"] = "18.2.0";
          pkg.dependencies["react-native"] = "0.72.6";
          pkg.dependencies["axios"] = "^1.6.2";
          
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          console.log("✅ Expo y dependencias aseguradas en package.json.");
          '

      - name: 🌐 Inyectar Configuración API
        run: |
          mkdir -p src/api
          cat << 'API_EOF' > src/api/endpoints.js
          import axios from "axios";
          const SERVER_URL = "https://api.kingsystem.com/v1";
          export const apiClient = axios.create({
            baseURL: SERVER_URL,
            timeout: 10000,
            headers: { "Content-Type": "application/json", "Accept": "application/json" }
          });
          export const endpoints = {
            auth: { login: "/auth/login", register: "/auth/register" },
            system: { sync: "/system/sync-nodes", status: "/system/status" }
          };
          console.log("🌐 API Lista");
          API_EOF

      - name: 📥 Instalar dependencias con YARN
        run: |
          npm install -g yarn
          yarn install --legacy-peer-deps

      - name: 🛠️ Preparar Metro y Permisos de Internet
        run: |
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require("@react-native/metro-config");
          module.exports = mergeConfig(getDefaultConfig(__dirname), {});
          INNER_EOF

          python3 -c '
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          try:
              with open(path, "r") as f:
                  content = f.read()
              perms = "<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n"
              if "android.permission.INTERNET" not in content:
                  content = re.sub(r"(<application)", perms + r"\1", content)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
          except Exception as e:
              print("Manifest check skipped:", e)
          '

      - name: 🔨 Compilar APK Release con Gradle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          cd android && ./gradlew clean assembleRelease

      - name: 📤 Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
