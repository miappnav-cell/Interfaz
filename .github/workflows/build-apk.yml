name: "Build King System APK Release"

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Configurar Paquetes, Permisos y Metro
        run: |
          # 1. Configurar package.json y asegurar dependencias de Metro
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.name = "king-system-interfaz";
          pkg.displayName = "King System";
          pkg.overrides = pkg.overrides || {};
          pkg.overrides["connect"] = "3.7.0";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Crear un metro.config.js robusto que no dependa de modulos externos rotos
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          const config = {};
          module.exports = mergeConfig(getDefaultConfig(__dirname), config);
          INNER_EOF

          # 3. Asegurar que @react-native/metro-config esté instalado
          npm install --save-dev @react-native/metro-config

          # 4. Actualizar el nombre visible en Android (strings.xml)
          STRINGS_PATH="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_PATH" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">King System<\/string>/g' "$STRINGS_PATH"
          fi

          # 5. Inyectar Permisos Esenciales de Android en AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # Verificar e inyectar permisos justo antes de la etiqueta <application>
            PERMISSIONS='    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />'
            
            # Insertar antes de <application si no existen
            python3 -c '
            import re
            path = "android/app/src/main/AndroidManifest.xml"
            with open(path, "r") as f:
                content = f.read()
            perms = """
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            """
            if "android.permission.INTERNET" not in content:
                content = re.sub(r"(<application)", perms + r"\1", content)
                with open(path, "w") as f:
                    f.write(content)
            '
          fi

      - name: 📥 Instalar Dependencias del Proyecto
        run: npm install

      - name: 📂 Crear Directorio de Assets de Android
        run: mkdir -p android/app/src/main/assets

      - name: ⚡ Generar Bundle Offline de Producción
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 🔨 Compilar APK de Producción (Release)
        run: |
          cd android && ./gradlew assembleRelease

      - name: 📤 Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
