name: "Build King System APK Release"

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24 (Sin Advertencias)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💣 Destrucción de Cachés
        run: |
          rm -rf node_modules package-lock.json yarn.lock android/.gradle android/app/build

      - name: 📝 Escribir package.json con AXIOS
        run: |
          cat << 'JSON_EOF' > package.json
          {
            "name": "king-system",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "android": "react-native run-android",
              "start": "react-native start"
            },
            "dependencies": {
              "react": "18.2.0",
              "react-native": "0.72.6",
              "axios": "^1.6.2"
            },
            "devDependencies": {
              "@babel/core": "^7.20.0",
              "@babel/preset-env": "^7.20.0",
              "@babel/runtime": "^7.20.0",
              "@react-native/metro-config": "^0.72.6",
              "babel-jest": "^29.2.1",
              "jest": "^29.2.1",
              "metro-react-native-babel-preset": "0.76.8",
              "react-test-renderer": "18.2.0",
              "typescript": "5.0.4"
            }
          }
          JSON_EOF

      - name: 🌐 Inyectar Configuración API
        run: |
          mkdir -p src/api
          cat << 'API_EOF' > src/api/endpoints.js
          import axios from 'axios';
          const SERVER_URL = 'https://api.kingsystem.com/v1';
          export const apiClient = axios.create({
            baseURL: SERVER_URL,
            timeout: 10000,
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
          });
          export const endpoints = {
            auth: { login: '/auth/login', register: '/auth/register' },
            system: { sync: '/system/sync-nodes', status: '/system/status' }
          };
          console.log('🌐 API Lista');
          API_EOF

      - name: 📥 Instalar con YARN
        run: |
          npm install -g yarn
          yarn install

      - name: 🛠️ Preparar Metro y Permisos de Internet
        run: |
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          module.exports = mergeConfig(getDefaultConfig(__dirname), {});
          INNER_EOF

          python3 -c '
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          try:
              with open(path, "r") as f:
                  content = f.read()
              perms = "<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n"
              if "android.permission.INTERNET" not in content:
                  content = re.sub(r"(<application)", perms + r"\1", content)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
          except Exception as e:
              print("Skipped manifest:", e)
          '

      - name: 🔨 Compilar APK Release con Gradle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          cd android && ./gradlew clean assembleRelease

      - name: 📤 Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
