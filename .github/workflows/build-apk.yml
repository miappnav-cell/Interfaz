name: "Build King System APK"

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🏷️ Renombrar App a "King System" y Aplicar Parches
        run: |
          # 1. Configurar nombre y display name en package.json
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.name = "king-system-interfaz";
          pkg.displayName = "King System";
          pkg.overrides = pkg.overrides || {};
          pkg.overrides["connect"] = "3.7.0";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Actualizar el nombre visible en Android (strings.xml) si existe
          STRINGS_PATH="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_PATH" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">King System<\/string>/g' "$STRINGS_PATH"
          fi

          # 3. Asegurar metro.config.js
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          const config = {};
          module.exports = mergeConfig(getDefaultConfig(__dirname), config);
          INNER_EOF

      - name: 📥 Instalar Dependencias
        run: npm install

      - name: 🔨 Compilar APK de Android (Debug/Release)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: King-System-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
