name: "Build King System APK Release"

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔍 Ejecutar Auditoría Total (Pantallas, Nodos, Animaciones, Sonidos y APIs)
        run: |
          node audit-project.js

      - name: 💣 Limpieza Profunda de Cachés
        run: |
          rm -rf node_modules package-lock.json yarn.lock android ios .gradle android/app/build

      - name: 📝 Blindar app.json y package.json
        run: |
          cat << 'APP_EOF' > app.json
          {
            "expo": {
              "name": "King System",
              "slug": "king-system",
              "version": "1.0.0",
              "sdkVersion": "49.0.0",
              "android": {
                "package": "com.kingsystem.interfaz"
              }
            }
          }
          APP_EOF

          node -e '
          const fs = require("fs");
          let pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (!pkg.version || pkg.version.trim() === "") pkg.version = "1.0.0";
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies["expo"] = "~49.0.15";
          pkg.dependencies["expo-status-bar"] = "~1.6.0";
          pkg.dependencies["react"] = "18.2.0";
          pkg.dependencies["react-native"] = "0.72.6";
          pkg.dependencies["axios"] = "^1.6.2";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: 🌐 Asegurar Configuración API
        run: |
          mkdir -p src/api
          if [ ! -f "src/api/endpoints.js" ]; then
            cat << 'API_EOF' > src/api/endpoints.js
            import axios from "axios";
            const SERVER_URL = "https://api.kingsystem.com/v1";
            export const apiClient = axios.create({
              baseURL: SERVER_URL,
              timeout: 10000,
              headers: { "Content-Type": "application/json", "Accept": "application/json" }
            });
            export const endpoints = {
              auth: { login: "/auth/login", register: "/auth/register" },
              system: { sync: "/system/sync-nodes", status: "/system/status" }
            };
            API_EOF
          fi

      - name: 📥 Instalar dependencias con YARN
        run: |
          npm install -g yarn
          yarn install --legacy-peer-deps

      - name: 🏗️ Generar Entorno Nativo con Expo Prebuild
        run: |
          npx expo prebuild --platform android --clean --non-interactive

      - name: 🔨 Compilar APK con Todos los Recursos Incluidos
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: 📤 Subir APK Definitivo
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
