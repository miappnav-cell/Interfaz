name: "Build King System APK Release"

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Sanitizar package.json, Permisos y Metro
        run: |
          # 1. Limpiar versiones vacías o inválidas en package.json de forma estricta
          node -e '
          const fs = require("fs");
          let pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.name = "king-system-interfaz";
          pkg.displayName = "King System";
          pkg.overrides = pkg.overrides || {};
          pkg.overrides["connect"] = "3.7.0";

          ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"].forEach(depType => {
            if (pkg[depType]) {
              for (let key of Object.keys(pkg[depType])) {
                let val = pkg[depType][key];
                if (!val || typeof val !== "string" || val.trim() === "" || val.trim() === "null" || val.trim() === "undefined") {
                  console.log(`[Sanitizer] Eliminando dependencia con versión vacía/inválida: ${key} -> "${val}"`);
                  delete pkg[depType][key];
                }
              }
            }
          });

          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          console.log("package.json saneado correctamente.");
          '

          # 2. Eliminar cualquier lockfile viejo que pueda causar conflictos
          rm -f package-lock.json

          # 3. Crear metro.config.js robusto
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          const config = {};
          module.exports = mergeConfig(getDefaultConfig(__dirname), config);
          INNER_EOF

          # 4. Asegurar @react-native/metro-config
          npm install --save-dev @react-native/metro-config --legacy-peer-deps

          # 5. Actualizar strings.xml para el nombre de Android
          STRINGS_PATH="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_PATH" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">King System<\/string>/g' "$STRINGS_PATH"
          fi

          # 6. Inyectar Permisos Esenciales de Android en AndroidManifest.xml
          python3 -c '
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          try:
              with open(path, "r") as f:
                  content = f.read()
              perms = """
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              """
              if "android.permission.INTERNET" not in content:
                  content = re.sub(r"(<application)", perms + r"\1", content)
                  with open(path, "w") as f:
                      f.write(content)
          except Exception as e:
              print("Manifest check skipped:", e)
          '

      - name: 📥 Instalar Dependencias Limpias
        run: npm install --legacy-peer-deps

      - name: 📂 Crear Directorio de Assets de Android
        run: mkdir -p android/app/src/main/assets

      - name: ⚡ Generar Bundle Offline de Producción
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 🔨 Compilar APK de Producción (Release)
        run: |
          cd android && ./gradlew assembleRelease

      - name: 📤 Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
