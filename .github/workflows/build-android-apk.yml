name: "Compilar y Ensamblar APK de Producción"

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Descargar el código fuente
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      # 2. Configurar Node.js (Actualizado a Node 24 sin el validador de cache estricto)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Configurar Java JDK 17 para Gradle
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Inyectar correcciones estructurales y recrear package-lock limpio
      - name: Aplicar parches de configuración y dependencias
        run: |
          # Reconstruir metro.config.js
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          const config = {};
          module.exports = mergeConfig(getDefaultConfig(__dirname), config);
          INNER_EOF

          # Inyectar override de connect@3.7.0 para solucionar el error de 'handle'
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.overrides = pkg.overrides || {};
          pkg.overrides["connect"] = "3.7.0";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      # 5. Instalar todas las librerías generando un package-lock.json nuevo en la nube
      - name: Instalar dependencias de Node.js
        run: |
          npm install --legacy-peer-deps

      # 6. Inyectar de forma física tus 22 pantallas en las carpetas de Android (Adiós pantalla roja)
      - name: Compilar y empaquetar bundle de React Native para Android
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # 7. Configurar permisos para el ejecutable de Gradle
      - name: Configurar permisos para Gradle
        run: chmod +x android/gradlew

      # 8. Compilación Nativa del archivo APK
      - name: Compilar APK con Gradle (Release Build)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # 9. Guardar y empaquetar el archivo final para su descarga directa
      - name: Subir APK compilado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Interfaz-v2.4.0
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
