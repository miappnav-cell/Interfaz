name: "Compilar y Ensamblar APK de Producción"

on:
  workflow_dispatch: # Permite activar la compilación manualmente con un botón desde GitHub

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Descargar el código fuente desde el repositorio
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Configurar Java JDK (Esencial para que Android Studio/Gradle puedan compilar)
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Inyectar correcciones estructurales de dependencias (Evita el bug del 'handle')
      - name: Aplicar parches de configuración y dependencias
        run: |
          # Asegurar metro.config.js limpio
          cat << 'INNER_EOF' > metro.config.js
          const { getDefaultConfig, mergeConfig } = require('@react-native/metro-config');
          const config = {};
          module.exports = mergeConfig(getDefaultConfig(__dirname), config);
          INNER_EOF

          # Inyectar override de connect@3.7.0 para evitar caídas de Metro
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.overrides = pkg.overrides || {};
          pkg.overrides["connect"] = "3.7.0";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      # 5. Instalar todas las librerías del proyecto de forma limpia
      - name: Instalar dependencias de Node.js
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps

      # 6. ENSAMBLAJE REAL: Crear el bundle físico de JavaScript e inyectarlo en Android
      # Esto evita el error rojo de "Unable to load script" porque empaqueta las 22 pantallas dentro del APK
      - name: Compilar y empaquetar bundle de React Native para Android
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # 7. Otorgar permisos de ejecución al compilador de Gradle de Android
      - name: Configurar permisos para Gradle
        run: chmod +x android/gradlew

      # 8. Compilación Nativa: Ejecutar Gradle para construir el archivo APK
      - name: Compilar APK con Gradle (Release Build)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # 9. Extraer y guardar el archivo APK generado para que lo puedas descargar en tu teléfono
      - name: Subir APK compilado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: King-System-Interfaz-v2.4.0
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
